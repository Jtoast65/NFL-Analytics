name: keep-warm

# Pings the deployed services on a schedule so the Render free-tier API never
# spins down (it sleeps after ~15 min idle, causing a ~30-80s cold start on the
# next request). A lightweight /health ping every 10 min keeps it warm.
#
# Notes:
# - GitHub's cron scheduler runs at ~5 min granularity and may be delayed or skip
#   runs under load; that's fine for keep-warm.
# - GitHub disables scheduled workflows after 60 days with no repo activity.
# - Keeping Render awake 24/7 uses ~730 of the 750 free instance-hours/month. To
#   conserve hours, narrow the cron to a daytime window, e.g.
#   '*/10 13-06 * * *' (UTC) ≈ 6am-11pm Pacific.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

# If a run is still going when the next fires, cancel the stale one.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the FastAPI service (Render)
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 120 \
            https://nfl-analytics-api-aku6.onrender.com/health
          echo " — API health OK"

      - name: Nudge the Streamlit dashboard
        run: |
          curl -fsS --max-time 60 \
            https://nfl-analytics-crwjgsvzmwtrhl75mwpmtp.streamlit.app/_stcore/health || true
